apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nodeport
  labels:
    app: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: amqp
      port: 5672
      nodePort: {{ .Values.service.nodePort.amqp }}
    - name: management
      port: 15672
      nodePort: {{ .Values.service.nodePort.management }}
    - name: metrics
      port: 9419
      nodePort: {{ .Values.service.metricsNodePort }}