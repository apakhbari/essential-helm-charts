image:
  repository: registry.eniac-tech.com/rabbitmq/rabbitmq
  tag: 4.3.2-management-alpine
  pullPolicy: IfNotPresent

exporterImage:
  repository: registry.eniac-tech.com/rabbitmq/rabbitmq-exporter
  tag: 1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: eniac-registry

auth:
  username: admin
  password: "CHANGE-ME-STRONG-PASSWORD"
  erlangCookie: "CHANGE-ME-RANDOM-COOKIE-STRING"

persistence:
  enabled: true
  size: 4Gi
  storageClassName: "nfs-client-rabbit"     # set to your cluster's StorageClass, or "" for default

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

service:
  nodePort:
    amqp: 30672
    management: 30673
  metricsNodePort: 30674   # permanent, fixed NodePort for the exporter's /metrics

serviceMonitor:
  enabled: true
  interval: 30s
  # only needed if your Prometheus CR restricts serviceMonitorSelector by label
  additionalLabels: {}