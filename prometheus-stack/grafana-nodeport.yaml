apiVersion: v1
kind: Service
metadata:
  name: grafana-dashboard-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: prometheus-stack
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000 # Grafana listens on port 3000 internally
      nodePort: 32002