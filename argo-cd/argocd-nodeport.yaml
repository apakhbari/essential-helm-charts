apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server # Matches the core ArgoCD server deployment
  ports:
    - name: http
      port: 80
      targetPort: 8080 # ArgoCD server listens internally on 8080 (when insecure mode is enabled)
      nodePort: 32002
    - name: https
      port: 443
      targetPort: 8081 # If running in insecure mode behind a network layer, otherwise 8081
      nodePort: 32003