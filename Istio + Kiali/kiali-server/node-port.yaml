apiVersion: v1
kind: Service
metadata:
  name: kiali-dashboard-nodeport
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kiali # Matches the default Kiali deployment label
  ports:
    - name: http
      port: 20001
      targetPort: 20001
      nodePort: 32001 # You can pick any free port between 30000-32767